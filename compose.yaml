services:
  php-8.4:
    image: php:8.4-alpine
    entrypoint: ['sh', 'entrypoint.sh']
    environment:
      XDEBUG_CONFIG: 'client_host=host.docker.internal'
      XDEBUG_MODE: 'coverage,debug'
    volumes:
      - ./:/var/www/event-sourcing-with-php
    working_dir: /var/www/event-sourcing-with-php
